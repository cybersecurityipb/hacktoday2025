version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: laravel-app:latest
    container_name: laravel_app
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html:delegated
    environment:
      - COMPOSER_ALLOW_SUPERUSER=1
    networks:
      - laravel
    restart: unless-stopped

  web:
    image: nginx:stable-alpine
    container_name: laravel_web
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - laravel
    restart: unless-stopped

  bot:
    build:
      context: ./bot
      dockerfile: Dockerfile
    image: ctf-bot
    container_name: ctf_bot
    environment:
      - APP_URL=http://web/
      - FLAG=hacktoday{maaf_website_bapuk_full_dicoding_dengan_chatgpt}
      - PORT=3001
    ports:
      - "5001:3001"
    depends_on:
      - web
    networks:
      - laravel
    restart: unless-stopped


networks:
  laravel:
    driver: bridge
